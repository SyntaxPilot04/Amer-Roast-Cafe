<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amer Roast Café | Contact</title>
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-amber-50 font-sans text-stone-900">

  <header class="sticky top-0 z-50 border-b border-amber-200 bg-amber-50">
    <div class="mx-auto flex max-w-6xl flex-col items-center gap-3 px-5 py-4 md:flex-row md:justify-between">
      <a href="index.html" class="font-serif text-2xl font-bold hover:text-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-600">☕ Amer Roast</a>
      <nav aria-label="Main navigation">
        <ul class="flex flex-wrap justify-center gap-2 text-sm font-semibold">
          <li><a href="index.html" class="rounded-full px-4 py-2 hover:bg-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-600">Home</a></li>
          <li><a href="menu.html" class="rounded-full px-4 py-2 hover:bg-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-600">Our menu</a></li>
          <li><a href="gallery.html" class="rounded-full px-4 py-2 hover:bg-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-600">The café</a></li>
          <li><a href="contact.html" aria-current="page" class="rounded-full bg-amber-200 px-4 py-2 hover:bg-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-600">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="bg-amber-100">
      <div class="mx-auto max-w-6xl px-5 py-14">
        <h1 class="font-serif text-4xl font-bold sm:text-5xl">Let's make it a coffee date</h1>
        <p class="mt-3 max-w-2xl text-stone-600">Book a table, ask a question or simply say hello.</p>
      </div>
    </section>

    <section class="mx-auto grid max-w-6xl gap-8 px-5 py-12 lg:grid-cols-2">
      <div class="rounded-2xl bg-white p-6 shadow-md">
        <h2 class="font-serif text-3xl font-bold">How can we help?</h2>
        <form action="#" method="post" class="mt-6 grid gap-5">
          <div>
            <label for="name" class="mb-2 block text-sm font-bold">Your name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="e.g. Aarav Sharma" required class="w-full rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 hover:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-600">
          </div>
          <div>
            <label for="phone" class="mb-2 block text-sm font-bold">Phone number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="e.g. 98765 43210" required class="w-full rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 hover:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-600">
          </div>
          <div>
            <label for="service" class="mb-2 block text-sm font-bold">What is this about?</label>
            <select id="service" name="service" required class="w-full rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 hover:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-600">
              <option value="">Choose an option</option>
              <option>Table booking</option>
              <option>Dine-in question</option>
              <option>Takeaway order</option>
              <option>Event or group enquiry</option>
            </select>
          </div>
          <div>
            <label for="message" class="mb-2 block text-sm font-bold">Your message</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell us the date, time and number of guests..." required class="w-full rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 hover:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-600"></textarea>
          </div>
          <button type="submit" class="rounded-full bg-amber-700 px-6 py-3 font-bold text-white hover:bg-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:ring-offset-2">Send your message</button>
        </form>
      </div>
